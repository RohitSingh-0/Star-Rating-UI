<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How did we do?</title>
    <!-- Add your CSS file link here -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div class="margin">
            <span id="star-icon"> <img id="star-image" src="icon-star.svg" alt="Placeholder Image"> </span>
            <h1>How did we do?</h1>
            <p id="feedback-text">Please let us know how we did with your support request. All feedback is appreciated
                to help us improve our offerings!</p>
            <div id="ratingbuttons">
                <button class="rating"> <span>1</span></button>
                <button class="rating"> <span>2</span></button>
                <button class="rating"> <span>3</span></button>
                <button class="rating"> <span>4</span></button>
                <button class="rating"> <span>5</span></button>
            </div>
            <button id="submit-button"> <span class="font_weight">Submit</span></button>
        </div>
    </div>
    <div id="thank-you">
        <div class="margin">
            <img src="illustration-thank-you.svg" alt="Thank you" class="thank-image" />
            <p class="selected-text">You selected <span id="selected-rating">0</span> out of 5</p>
            <h1>Thank You!</h1>
            <p class="note">We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in touch!</p>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
